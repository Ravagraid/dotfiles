# Options: Basic
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g escape-time 0 
set -g mouse on
set -g set-clipboard on
set -g history-limit 10000

# Options: Indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Options: Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Bindings: panes
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Bindings: windows
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

bind r source-file $DOTFILES/tmux/tmux.conf \; display "Config reloaded!"

#Theme: borders
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright

# Status Bar
set -g status-style bg=default,fg=#D3C6AA
set -g status-justify centre
set -g status-position top
set -g status-left "ᓚᘏᗢ"
set -g status-right ""
set -g status-right-length 50

set -g window-status-format "●"
set -g window-status-current-format "●"
set -g window-status-current-style "#{?window_zoomed_flag,fg=#D3C6AA,fg=#A7C080\#,nobold}"

set -g window-status-bell-style "fg=red,nobold"
