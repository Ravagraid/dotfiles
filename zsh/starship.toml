"$schema" = "https://starship.rs/config-schema.json"

palette = "everforest"
add_newline = true
continuation_prompt = "[   ··· ](dimmed gray)"

format = """
[╭─](gray) $directory$git_branch$git_state$git_status$git_metrics$fill$time
[╰─](gray) $container$env_var$shlvl$status$sudo$hostname$username$localip$jobs$character"""

right_format = """$cmd_duration$python$nodejs$deno$rust$golang$lua$c$java$ruby$swift$pixi$conda$nix_shell$package$docker_context$battery"""

[fill]
symbol = " "
style = "dimmed gray"

[os]
disabled = true
format = "[$symbol](white) "

[os.symbols]
Arch = "󰣇"
Linux = ""
Ubuntu = ""
Fedora = ""
Macos = ""
Windows = ""

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❯](bold purple)"
vimcmd_replace_symbol = "[❯](bold purple)"
vimcmd_visual_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
home_symbol = "~"
read_only = "  "
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_style = "bold cyan"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[ $branch(:$remote_branch)]($style) "
style = "bold purple"
truncation_symbol = "…"
truncation_length = 20
only_attached = true

[git_metrics]
format = "([ $added]($added_style) )([ $deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"
disabled = false

[git_status]
format = "( $all_status$ahead_behind)"
style = "dimmed white"
ahead = "[⇡${count}](green) "
behind = "[⇣${count}](red) "
diverged = "[⇡${ahead_count}⇣${behind_count}](purple) "
conflicted = "[=${count}](bold red) "
untracked = "[?${count}](blue) "
stashed = "[≡${count}](dimmed purple) "
modified = "[!${count}](yellow) "
staged = "[+${count}](bold green) "
renamed = "[»${count}](cyan) "
deleted = "[✘${count}](red) "

[cmd_duration]
format = "[ $duration ]($style)"
style = "yellow"
min_time = 2_000

[time]
disabled = false
format = "[$time]($style)"
time_format = "%a %R"
style = "dimmed white"

[env_var.VIMSHELL]
format = "[$env_value]($style) "
style = "green italic"

[shlvl]
disabled = false
format = "[$symbol]($style) "
symbol = "↕"
style = "dimmed yellow"
threshold = 2

[username]
style_user = "bold yellow"
style_root = "bold red"
format = "[$user ]($style)"
disabled = false
show_always = false

[sudo]
format = "[⚡]($style) "
style = "bold red"
disabled = false

[jobs]
format = "[ $number]($style) "
style = "blue"

[localip]
ssh_only = true
format = "[ $localipv4]($style) "
style = "bold purple"
disabled = false

[battery]
format = "[$symbol$percentage ]($style)"
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 70
style = "dimmed purple"

[python]
symbol = " "
format = "[$symbol$version ]($style)"
style = "yellow"
version_format = "${raw}"

[nodejs]
symbol = " "
format = "[$symbol$version ]($style)"
style = "green"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock", "bun.lockb"]
detect_folders = ["node_modules"]
detect_extensions = []

[deno]
symbol = " "
format = "[$symbol$version ]($style)"
style = "green"
version_format = "${raw}"

[rust]
symbol = " "
format = "[$symbol$version ]($style)"
style = "red"
version_format = "${raw}"

[golang]
symbol = " "
format = "[$symbol$version ]($style)"
style = "cyan"
version_format = "${raw}"

[lua]
symbol = " "
format = "[$symbol$version ]($style)"
style = "blue"
version_format = "${raw}"

[c]
symbol = " "
format = "[$symbol$version ]($style)"
style = "white"
version_format = "${raw}"

[java]
symbol = " "
format = "[$symbol$version ]($style)"
style = "red"
version_format = "${raw}"

[ruby]
symbol = " "
format = "[$symbol$version ]($style)"
style = "red"
version_format = "${raw}"

[swift]
symbol = " "
format = "[$symbol$version ]($style)"
style = "orange"
version_format = "${raw}"

[package]
symbol = " "
format = "[$symbol$version ]($style)"
style = "dimmed orange"
version_format = "${raw}"

[docker_context]
symbol = " "
format = "[$symbol$context ]($style)"
style = "blue"

[pixi]
format = "[pixi $environment ]($style)"

[conda]
symbol = " "
format = "[$symbol$environment ]($style)"

[nix_shell]
format = "[❄ $state ]($style)"
style = "bold blue"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""

[container]
format = "[ $name ]($style)"
style = "dimmed red"

[aws]
disabled = true

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold yellow"
rebase = "REBASE"
merge = "MERGE"
revert = "REVERT"
cherry_pick = " PICK"
bisect = "BISECT"
am = "AM"
am_or_rebase = "AM/REBASE"

[status]
disabled = false
format = "[$symbol$signal_name ]($style)"
symbol = "✘ "
style = "bold red"
map_symbol = true
sigint_symbol = "✘ "
signal_symbol = "⚠ "
not_executable_symbol = " "
not_found_symbol = " "

[hostname]
ssh_only = true
format = "[$hostname ]($style)"
style = "bold green"
disabled = false

[palettes.everforest]
orange = "#e69875"
gray = "#7a8478"
